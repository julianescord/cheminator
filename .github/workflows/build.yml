name: Build y tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build

      - name: Ejecutar pruebas
        run: ctest --test-dir build --output-on-failure

  # Verifica que la libreria compile por si sola, sin el programa de consola
  # ni las pruebas: es el modo en que la consume otro software.
  solo-libreria:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar solo la libreria
        run: >
          cmake -S . -B build-lib
          -DCMAKE_BUILD_TYPE=Release
          -DCHEMINATOR_BUILD_CLI=OFF
          -DCHEMINATOR_BUILD_TESTS=OFF

      - name: Compilar
        run: cmake --build build-lib

      - name: Verificar instalacion
        run: cmake --install build-lib --prefix ./instalada && ls -R ./instalada

      # La frontera en C es lo que permite embeber la libreria desde otros
      # lenguajes, asi que se compila con un compilador de C de verdad para
      # comprobar que el header es valido como C y no solo como C++.
      - name: Compilar un consumidor en C
        run: |
          cat > consumidor.c <<'FIN'
          #include <cheminator/cheminator.h>
          #include <stdio.h>
          #include <string.h>
          int main(void) {
              /* De la formula al nombre. */
              chem_resultado *r = chem_nombrar("Fe2O3");
              if (r == NULL) return 1;
              printf("%s -> %s\n", chem_resultado_categoria(r), chem_resultado_nombre(r));
              int ok = chem_resultado_ok(r) &&
                       strcmp(chem_resultado_nombre(r), "oxido de Hierro (III)") == 0;
              chem_resultado_liberar(r);
              if (!ok) return 1;

              /* Y de vuelta, que es el camino inverso sobre el mismo tipo. */
              chem_resultado *i = chem_formular("oxido de hierro (III)");
              if (i == NULL) return 1;
              printf("%s -> %s\n", chem_resultado_categoria(i), chem_resultado_formula(i));
              ok = chem_resultado_ok(i) && strcmp(chem_resultado_formula(i), "Fe2O3") == 0;
              chem_resultado_liberar(i);
              return ok ? 0 : 1;
          }
          FIN
          gcc -std=c11 -Wall -Wextra -I./instalada/include -c consumidor.c -o consumidor.o
          g++ -o consumidor consumidor.o ./instalada/lib/libcheminator.a
          ./consumidor

  webassembly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Compilar a WebAssembly
        run: |
          emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release -DCHEMINATOR_BUILD_TESTS=OFF
          cmake --build build-wasm

      - name: Ejecutar el modulo con Node
        run: |
          cat > build-wasm/prueba.mjs <<'FIN'
          import crearCheminator from './cheminator.js';
          const Modulo = await crearCheminator();

          const resultado = Modulo.nombrar('Al2(SO4)3');
          if (!resultado.ok || resultado.nombre !== 'sulfato de Aluminio') {
              console.error('Resultado inesperado:', resultado.nombre, resultado.error);
              process.exit(1);
          }
          console.log(`v${Modulo.version()} ${resultado.categoria}: ${resultado.nombre}`);

          // La direccion inversa, incluida la tolerancia a tildes.
          const inverso = Modulo.formular('Óxido de Hierro (III)');
          if (!inverso.ok || inverso.formula !== 'Fe2O3') {
              console.error('Formulacion inesperada:', inverso.formula, inverso.error);
              process.exit(1);
          }
          console.log(`${inverso.categoria}: ${inverso.formula}`);
          FIN
          node build-wasm/prueba.mjs
